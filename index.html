<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC 2008 - মহাপুনর্মিলনী</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #fff; min-height: 100vh; padding-bottom: 50px; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 30px 0 10px; }
        h1 { font-size: 2.8rem; background: linear-gradient(45deg, #f39c12, #f1c40f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        p.subtitle { font-size: 1.1rem; color: #bdc3c7; margin-top: 5px; }

        /* Timer */
        .timer-container { display: flex; justify-content: center; gap: 12px; margin: 25px 0; }
        .time-box { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); padding: 12px; border-radius: 12px; min-width: 75px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); }
        .time-box span { display: block; font-size: 1.6rem; font-weight: bold; color: #f39c12; }
        .time-box label { font-size: 0.75rem; color: #ddd; }

        /* Glass Card */
        .card { background: rgba(22, 31, 43, 0.85); backdrop-filter: blur(12px); padding: 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #f39c12; font-weight: 600; font-size: 0.95rem; }
        input[type="text"], input[type="tel"], input[type="file"] { width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid #34495e; background: #0d131a; color: #fff; font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus { border-color: #f39c12; box-shadow: 0 0 8px rgba(243, 156, 18, 0.4); }
        
        button.btn-submit { width: 100%; padding: 14px; background: linear-gradient(45deg, #e67e22, #f39c12); color: #fff; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4); }
        button.btn-submit:hover { transform: translateY(-2px); }

        /* Table Area */
        .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .count-badge { background: #f39c12; color: #000; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
        .btn-excel { background: #27ae60; color: #fff; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: bold; }

        .table-responsive { overflow-x: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; background: rgba(13, 19, 26, 0.6); }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #2c3e50; vertical-align: middle; }
        th { background: #1f2c3f; color: #f39c12; font-size: 0.9rem; }
        
        /* User Image Frame */
        .user-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #f39c12; }
        .btn-delete { background: #e74c3c; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.8rem; }
        .btn-delete:hover { background: #c0392b; }

        footer { text-align: center; color: #bdc3c7; margin-top: 30px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SSC 2008</h1>
            <p class="subtitle">🎉 বন্ধুত্বের স্মারক - মহাপুনর্মিলনী রেজিস্ট্রেশন 🎉</p>
        </header>

        <div class="timer-container">
            <div class="time-box"><span id="days">00</span><label>দিন</label></div>
            <div class="time-box"><span id="hours">00</span><label>ঘণ্টা</label></div>
            <div class="time-box"><span id="minutes">00</span><label>মিনিট</label></div>
            <div class="time-box"><span id="seconds">00</span><label>সেকেন্ড</label></div>
        </div>

        <!-- রেজিস্ট্রেশন ফরম -->
        <div class="card">
            <form id="reunionForm">
                <div class="form-group">
                    <label for="stdName"><i class="fa-solid fa-user"></i> আপনার নাম *</label>
                    <input type="text" id="stdName" placeholder="আপনার পূর্ণ নাম লিখুন" required>
                </div>
                <div class="form-group">
                    <label for="stdPhone"><i class="fa-solid fa-phone"></i> ফোন নম্বর (WhatsApp) *</label>
                    <input type="tel" id="stdPhone" placeholder="০১৭xxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label for="stdPhoto"><i class="fa-solid fa-image"></i> আপনার ছবি সিলেক্ট করুন (ঐচ্ছিক)</label>
                    <input type="file" id="stdPhoto" accept="image/*">
                </div>
                <button type="submit" id="submitBtn" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> তথ্য সাবমিট করুন
                </button>
            </form>
        </div>

        <!-- নিবন্ধিত তালিকা -->
        <div class="card">
            <h2 style="margin-bottom: 15px; text-align: center; color: #f39c12;">নিবন্ধিত বন্ধুদের তালিকা</h2>
            <div class="stats-bar">
                <div>মোট নিবন্ধিত: <span id="totalCount" class="count-badge">0</span> জন</div>
                <a href="#" id="exportBtn" class="btn-excel"><i class="fa-solid fa-file-excel"></i> এক্সেল (CSV) ডাউনলোড</a>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ছবি</th>
                            <th>নাম</th>
                            <th>ফোন নম্বর</th>
                            <th>তারিখ</th>
                            <th>অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 এসএসসি ২০০৮ ব্যাচ। সর্বস্বত্ব সংরক্ষিত।</p>
        </footer>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7A5A6d9MpT8X68lYXugK2hAB-tye_iwYnaadbe4T48xtPRwITQSeixdqRB0VlvcCbIA/exec";

        // ১. কাউন্টডাউন টাইমার
        const eventDate = new Date("December 25, 2026 10:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = eventDate - now;

            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        }, 1000);

        // ২. ডাটা রেন্ডার ও লোড
        document.addEventListener("DOMContentLoaded", renderStudentList);

        function getStudentsData() {
            try {
                const data = localStorage.getItem("ssc08_reunion_students");
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function saveStudentsData(data) {
            localStorage.setItem("ssc08_reunion_students", JSON.stringify(data));
        }

        function renderStudentList() {
            const students = getStudentsData();
            const tbody = document.getElementById("studentTableBody");
            const totalCount = document.getElementById("totalCount");
            
            tbody.innerHTML = "";
            totalCount.innerText = students.length;

            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#7f8c8d;">এখনো কেউ নিবন্ধিত হয়নি।</td></tr>`;
                return;
            }

            students.forEach((student, index) => {
                const tr = document.createElement("tr");
                const defaultAvatar = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                const photoSrc = student.photo || defaultAvatar;

                tr.innerHTML = `
                    <td><img src="${photoSrc}" class="user-img" alt="photo"></td>
                    <td><b>${student.name}</b></td>
                    <td>${student.phone}</td>
                    <td>${student.date}</td>
                    <td><button class="btn-delete" onclick="deleteStudent(${index})"><i class="fa-solid fa-trash"></i> মুছে ফেলুন</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ৩. শিক্ষার্থী ডিলিট করার ফংশন
        window.deleteStudent = function(index) {
            if(confirm("আপনি কি নিশ্চিতভাবে এই নামটি তালিকা থেকে মুছে ফেলতে চান?")) {
                const currentList = getStudentsData();
                currentList.splice(index, 1);
                saveStudentsData(currentList);
                renderStudentList();
            }

        };

        // ৪. ফর্ম সাবমিট
        document.getElementById("reunionForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById("submitBtn");
            const name = document.getElementById("stdName").value.trim();
            const phone = document.getElementById("stdPhone").value.trim();
            const photoInput = document.getElementById("stdPhoto");
            
            if(!name || !phone) return;

            const date = new Date().toLocaleDateString('bn-BD');
            submitBtn.innerText = "প্রসেসিং হচ্ছে...";
            submitBtn.disabled = true;

            // ছবি রিড করার লজিক (Base64)
            const processAndSave = (photoBase64) => {
                const newStudent = { name, phone, date, photo: photoBase64 };

                // ক. লোকাল স্টোরেজ ও টেবিল আপডেট
                const currentList = getStudentsData();
                currentList.push(newStudent);
                saveStudentsData(currentList);
                renderStudentList();

                // খ. গুগল শিটে ডাটা ব্যাকগ্রাউন্ড সিঙ্ক
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, date })
                }).catch(err => console.error(err));

                // রিসেট ও সতর্কবার্তা
                document.getElementById("reunionForm").reset();
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> তথ্য সাবমিট করুন';
                submitBtn.disabled = false;

                alert("অভিনন্দন " + name + "! আপনার তথ্য সফলভাবে নিবন্ধিত হয়েছে।");
            };

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { processAndSave(e.target.result); };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                processAndSave(null);
            }
        });

        // ৫. এক্সেল ফাইল ডাউনলোড
        document.getElementById("exportBtn").addEventListener("click", function(e) {
            e.preventDefault();
            const students = getStudentsData();
            if(students.length === 0) return alert("কোনো ডাটা নেই!");

            let csvContent = "data:text/csv;charset=utf-8,\uFEFFSerial,Name,Phone,Date\n";
            students.forEach((s, i) => { csvContent += `${i + 1},"${s.name}","${s.phone}","${s.date}"\n`; });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "SSC_2008_Registered_Students.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
