<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এসএসসি ২০০৮ - মহাপুনর্মিলনী</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d131a; color: #fff; line-height: 1.6; padding-bottom: 50px; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 40px 0 20px; }
        h1 { font-size: 2.5rem; color: #f39c12; margin-bottom: 10px; }
        p.subtitle { font-size: 1.1rem; color: #bdc3c7; }

        .timer-container { display: flex; justify-content: center; gap: 15px; margin: 30px 0; }
        .time-box { background: #161f2b; padding: 15px; border-radius: 10px; min-width: 80px; text-align: center; border: 1px solid #2c3e50; }
        .time-box span { display: block; font-size: 1.8rem; font-weight: bold; color: #e67e22; }
        .time-box label { font-size: 0.8rem; color: #7f8c8d; }

        .card { background: #161f2b; padding: 30px; border-radius: 15px; border: 1px solid #2c3e50; margin-bottom: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #ecf0f1; font-weight: 600; }
        input { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #34495e; background: #0d131a; color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: #f39c12; }
        
        button.btn-submit { width: 100%; padding: 14px; background: #e67e22; color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button.btn-submit:hover { background: #d35400; }
        button.btn-submit:disabled { background: #7f8c8d; cursor: not-allowed; }

        .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .count-badge { background: #f39c12; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        .btn-excel { background: #27ae60; color: #fff; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: #161f2b; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #2c3e50; }
        th { background: #1f2c3f; color: #f39c12; }
        tr:hover { background: #1a2536; }

        footer { text-align: center; color: #7f8c8d; margin-top: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SSC 2008</h1>
            <p class="subtitle">এসএসসি ২০০৮ - মহাপুনর্মিলনী রেজিস্ট্রেশন</p>
        </header>

        <div class="timer-container">
            <div class="time-box"><span id="days">00</span><label>দিন</label></div>
            <div class="time-box"><span id="hours">00</span><label>ঘণ্টা</label></div>
            <div class="time-box"><span id="minutes">00</span><label>মিনিট</label></div>
            <div class="time-box"><span id="seconds">00</span><label>সেকেন্ড</label></div>
        </div>

        <div class="card">
            <form id="reunionForm">
                <div class="form-group">
                    <label for="stdName">আপনার নাম *</label>
                    <input type="text" id="stdName" placeholder="আপনার পূর্ণ নাম লিখুন" required>
                </div>
                <div class="form-group">
                    <label for="stdPhone">ফোন নম্বর (WhatsApp) *</label>
                    <input type="tel" id="stdPhone" placeholder="০১৭xxxxxxxx" required>
                </div>
                <button type="submit" id="submitBtn" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> তথ্য সাবমিট করুন
                </button>
            </form>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 20px; text-align: center; color: #f39c12;">নিবন্ধিত বন্ধুদের তালিকা</h2>
            <div class="stats-bar">
                <div>মোট নিবন্ধিত: <span id="totalCount" class="count-badge">0</span> জন</div>
                <a href="#" id="exportBtn" class="btn-excel"><i class="fa-solid fa-file-excel"></i> এক্সেল (CSV) ফাইল ডাউনলোড</a>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ক্রমিক</th>
                            <th>নাম</th>
                            <th>ফোন নম্বর</th>
                            <th>তারিখ</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 এসএসসি ২০০৮ ব্যাচ। সর্বস্বত্ব সংরক্ষিত।</p>
        </footer>
    </div>

    <script>// গুগল শিটের ওয়েব অ্যাপ ইউআরএল (API)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7A5A6d9MpT8X68lYXugK2hAB-tye_iwYnaadbe4T48xtPRwITQSeixdqRB0VlvcCbIA/exec";

        // ১. কাউন্টডাউন টাইমার
        const eventDate = new Date("December 25, 2026 10:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = eventDate - now;

            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        }, 1000);

        // ২. লোকাল স্টোরেজ থেকে ডাটা হ্যান্ডেল করা
        document.addEventListener("DOMContentLoaded", renderStudentList);

        function getStudentsData() {
            try {
                const data = localStorage.getItem("ssc08_reunion_students");
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function saveStudentsData(data) {
            localStorage.setItem("ssc08_reunion_students", JSON.stringify(data));
        }

        function renderStudentList() {
            const students = getStudentsData();
            const tbody = document.getElementById("studentTableBody");
            const totalCount = document.getElementById("totalCount");
            
            tbody.innerHTML = "";
            totalCount.innerText = students.length;

            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#7f8c8d;">এখনো কেউ নিবন্ধিত হয়নি।</td></tr>`;
                return;
            }

            students.forEach((student, index) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${student.name}</td>
                    <td>${student.phone}</td>
                    <td>${student.date}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ৩. ফর্ম সাবমিট
        document.getElementById("reunionForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById("submitBtn");
            const name = document.getElementById("stdName").value.trim();
            const phone = document.getElementById("stdPhone").value.trim();
            
            if(!name || !phone) return;

            const date = new Date().toLocaleDateString('bn-BD');

            submitBtn.innerText = "জমা হচ্ছে...";
            submitBtn.disabled = true;

            const newStudent = { name, phone, date };

            // লোকাল তালিকায় যুক্ত ও পেজে দেখানো
            const currentList = getStudentsData();
            currentList.push(newStudent);
            saveStudentsData(currentList);
            renderStudentList();

            // গুগল শিটে ডাটা পাঠানো
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(newStudent)
            }).catch(err => console.error("Sync Error:", err));

            // রিসেট ও পপ-আপ মেসেজ
            document.getElementById("reunionForm").reset();
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> তথ্য সাবমিট করুন';
            submitBtn.disabled = false;

            alert("অভিনন্দন " + name + "! আপনার তথ্য সফলভাবে নিবন্ধিত হয়েছে।");
        });

        // ৪. এক্সেল (CSV) ডাউনলোড
        document.getElementById("exportBtn").addEventListener("click", function(e) {
            e.preventDefault();
            const students = getStudentsData();
            if(students.length === 0) {
                alert("ডাউনলোড করার মতো কোনো তথ্য নেই!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "Serial,Name,Phone,Date\n";

            students.forEach((s, i) => {
                csvContent += `${i + 1},"${s.name}","${s.phone}","${s.date}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "SSC_2008_Registered_Students.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
